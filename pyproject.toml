[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telao"
version = "2.0.0"
description = "Telas de apuracao do TSE: tela cheia 1920x1080 e monitor de cena 1080x1920"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.31", "PyYAML>=6.0"]

[project.scripts]
telao = "telao.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
