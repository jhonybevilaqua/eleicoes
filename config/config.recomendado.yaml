# ---------------------------------------------------------------------------
# Configuracao recomendada - TV, ClassX LiveBoard, eleicoes gerais 2026.
#
# Diferente do config.example.yaml (que documenta TODAS as opcoes), este
# arquivo e uma escolha fechada: o que eu poria no ar. Copie para
# config/config.yaml, ajuste as pracas e os numeros dos candidatos, e rode.
#
# As quatro decisoes que ele toma, e por que:
#
# 1. formato: json
#    Vinculo por nome de campo. Nao existe celula para deslocar, e os campos
#    numericos chegam tipados (o "As number" do Sort nem precisa ser marcado).
#
# 2. Dois exporters por praca, nao um.
#    'liveboard_fixo'  ordem: fixa      -> cena com foto/cor por posicao
#    'liveboard_rank'  ordem: colocacao -> placar/ranking
#    Custa zero gerar os dois. E evita o erro caro: numa cena com foto fixa,
#    'colocacao' faz a foto do A aparecer com os votos do B na primeira
#    virada. Errar para o lado de 'fixa' produz, no pior caso, uma lista fora
#    de ordem - problema estetico, nao factual.
#
# 3. Listas de campos enxutas.
#    So o que a cena usa. Menos campo = menos vinculo para conferir no D-1.
#
# 4. bloquear_nao_oficial: true, sempre.
#    O TSE publica simulados nos mesmos caminhos antes do pleito.
# ---------------------------------------------------------------------------

log:
  nivel: INFO
  arquivo: logs/gctse.log

tse:
  base_url: https://resultados.tse.jus.br/oficial
  ciclo: ele2026
  pleito: "000"     # <- 'gctse descobrir' quando o TSE publicar
  eleicao: "000"    # <- idem
  turno: 1

coleta:
  fonte: tse
  intervalo_segundos: 20
  paralelismo: 4
  timeout_segundos: 8
  tentativas: 3
  cache_condicional: true
  arquivo_estado: dados/estado/estado.json
  arquivo_saude: dados/estado/saude.json
  # Tela de validacao: abra no navegador e deixe num monitor. Recarrega sozinha.
  arquivo_painel: dados/estado/painel.html
  falhas_para_alerta: 3
  segundos_sem_dado_para_alerta: 300
  # Serie temporal: uma linha por boletim publicado. E o que permite curva de
  # apuracao, previsao de fechamento e marco de virada - o estado.json guarda
  # so o ultimo boletim e nao serve para grafico nenhum.
  historico: true
  arquivo_historico: dados/estado/historico.jsonl
  arquivo_graficos: dados/estado/graficos.json
  pontos_por_grafico: 240

seguranca:
  bloquear_nao_oficial: true
  bloquear_regressao: true
  pct_minimo_para_publicar: 0

texto:
  caixa: alta
  remover_acentos: false
  formatar_numeros: true
  separador_milhar: "."
  casas_percentual: 2
  sufixo_percentual: "%"
  selo_nao_oficial: "PARCIAL - NAO OFICIAL"
  limites:
    nome: 22          # afira contra o lower third real antes do D-7
    partido: 12
    cargo: 24
    abrangencia: 24

  # Arte das tarjas (ver docs/TARJAS.md). Arquivo nomeado pelo NUMERO da urna:
  # o numero e estavel, a grafia do nome nao.
  padrao_foto: "fotos/{numero}.png"
  cor_padrao: "#7d93b3"

  # Cor por partido. Alimenta a barra do placar, a tarja e - principalmente -
  # o mapa: e a cor do partido do lider que pinta cada estado.
  #
  # AJUSTAR COM A ARTE antes do D-7. Duas regras que evitam retrabalho:
  #  1. a mesma sigla tem a mesma cor em toda a programacao, do placar ao mapa;
  #  2. partidos que disputam a mesma praca precisam de cores distinguiveis no
  #     ar - inclusive por quem nao distingue vermelho de verde, que e 1 em
  #     cada 12 homens. Teste o mapa impresso em preto e branco: se dois
  #     estados vizinhos viram o mesmo cinza, o telespectador tambem perde.
  #
  # Sem entrada aqui, o partido usa 'cor_padrao' e o mapa fica de uma cor so.
  cores_partido:
    {}   # ex.: { PVL: "#2f97e8", PDR: "#c0392b", PXY: "#27ae60" }

saida:
  destino: dados/saida
  encoding: utf-8
  quebra_linha: crlf

exporters:

  # Cena com foto ou cor fixa por posicao. A pessoa naquela posicao nunca
  # muda, aconteca o que acontecer no placar.
  liveboard_fixo:
    tipo: classx
    formato: json
    ordem: fixa
    destino: dados/saida/liveboard/fixo
    nome_arquivo: "{alvo}"
    formato_nome_partido: "{nome} ({partido})"
    incluir_plano: true
    campos_resumo: [cargo, abrangencia, apuracao_pct, apuracao_pct_num, selo, hora_atualizacao]
    campos_candidato:
      [visivel, numero, nome, partido, nome_partido, percentual, percentual_num,
       votos, foto, cor, eleito, barra_px, barra_resto_px, barra_esc, barra_idx]
    # Geometria da barra ja calculada, para o GC nao precisar fazer conta.
    # AJUSTAR trilho_px ao comprimento real do trilho na cena. Ver docs/CASTALIA.md.
    barra:
      trilho_px: 420
      minimo_px: 6
      base: validos
    # AJUSTAR: numeros na ordem em que aparecem na cena.
    candidatos_fixos: ["10", "20", "30"]

  # Placar/ranking. Posicao 1 e sempre o 1o colocado.
  liveboard_rank:
    tipo: classx
    formato: json
    ordem: colocacao
    slots: 6
    destino: dados/saida/liveboard/rank
    nome_arquivo: "{alvo}"
    formato_nome_partido: "{nome} ({partido})"
    incluir_plano: true
    campos_resumo:
      [cargo, abrangencia, apuracao_pct, apuracao_pct_num, secoes_totalizadas,
       secoes_total, votos_validos, votos_brancos, votos_nulos, selo, hora_atualizacao]
    campos_candidato:
      [visivel, numero, nome, partido, nome_partido, percentual, percentual_num,
       votos, votos_num, eleito, barra_px, barra_resto_px, barra_esc, barra_idx]
    barra:
      trilho_px: 420
      minimo_px: 6
      base: validos       # troque para 'lider' nas cenas de deputado

  # Mapa do Brasil pintado pela cor do partido de quem lidera cada estado.
  # Gera SVG (1920x1080, entra na cena 1:1) e JSON (site e segunda tela).
  mapa_partido:
    tipo: mapa
    modo: partido
    destino: dados/saida/mapa
    titulo: "PRESIDENTE - LIDERANCA POR ESTADO"
    rotulo: sigla_pct       # sigla | sigla_pct | sigla_lider
    formatos: [svg, json]
    # fundo_transparente: true   # ligue para compor o mapa sobre a cena do GC

  # O mesmo mapa, pintado pelo percentual de urnas totalizadas: enche ao vivo.
  mapa_urnas:
    tipo: mapa
    modo: apuracao
    destino: dados/saida/mapa
    titulo: "URNAS TOTALIZADAS POR ESTADO"
    cor_escala: "#2f97e8"
    formatos: [svg, json]

  # Site, segunda tela e conferencia. Nao vai para o ar.
  web_json:
    tipo: json
    formato: completo
    destino: dados/saida/web
    nome_arquivo: "{alvo}"

alertas:
  ativo: false
  webhook_url: ${ALERTA_WEBHOOK_URL}   # Teams ou Power Automate
  prefixo: "[GC-TSE]"
  intervalo_repeticao_segundos: 600

mapeamento: {}

padroes_alvo:
  turno: 1
  exporters: [liveboard_rank, web_json]

# ---------------------------------------------------------------------------
# Mapa do Brasil: as 27 unidades da federacao alimentando um arquivo so.
#
# Mesma forma do rodizio (um exporter, uma lista de alvos), porque o problema e
# o mesmo. O grupo so e reescrito quando alguma praca do grupo muda.
#
# Nao vai usar o mapa? Apague esta secao e os alvos 'mapa-*' do fim do arquivo:
# sao 27 requisicoes por ciclo que deixam de existir.
# ---------------------------------------------------------------------------
mapas:
  mapa-presidente:
    exporter: mapa_partido
    alvos: [mapa-ac, mapa-al, mapa-am, mapa-ap, mapa-ba, mapa-ce, mapa-df, mapa-es, mapa-go, mapa-ma, mapa-mg, mapa-ms, mapa-mt, mapa-pa, mapa-pb, mapa-pe, mapa-pi, mapa-pr, mapa-rj, mapa-rn, mapa-ro, mapa-rr, mapa-rs, mapa-sc, mapa-se, mapa-sp, mapa-to]

  urnas-presidente:
    exporter: mapa_urnas
    alvos: [mapa-ac, mapa-al, mapa-am, mapa-ap, mapa-ba, mapa-ce, mapa-df, mapa-es, mapa-go, mapa-ma, mapa-mg, mapa-ms, mapa-mt, mapa-pa, mapa-pb, mapa-pe, mapa-pi, mapa-pr, mapa-rj, mapa-rn, mapa-ro, mapa-rr, mapa-rs, mapa-sc, mapa-se, mapa-sp, mapa-to]

# AJUSTAR as pracas. 'pr' esta aqui como exemplo do mercado da emissora.
alvos:
  - nome: presidente-br
    abrangencia: br
    cargo: 1
    exporters: [liveboard_fixo, liveboard_rank, web_json]

  - nome: governador-pr
    abrangencia: pr
    cargo: 3
    apelido_abrangencia: PARANA
    exporters: [liveboard_fixo, liveboard_rank, web_json]

  - nome: senador-pr
    abrangencia: pr
    cargo: 5
    apelido_abrangencia: PARANA

  - nome: dep-federal-pr
    abrangencia: pr
    cargo: 6
    limite_candidatos: 15

  # As 27 pracas que alimentam o mapa, na MESMA lista de alvos.
  # 'exporters: []' e proposital: existem so para o mapa, sem gerar arquivo
  # individual no hot folder. 'limite_candidatos: 2' porque o mapa usa 1o e 2o
  # colocado, e cortar no parser economiza tamanho de JSON vezes 27.
  - { nome: mapa-ac, abrangencia: ac, cargo: 1, limite_candidatos: 2, exporters: [] }
  - { nome: mapa-al, abrangencia: al, cargo: 1, limite_candidatos: 2, exporters: [] }
  - { nome: mapa-am, abrangencia: am, cargo: 1, limite_candidatos: 2, exporters: [] }
  - { nome: mapa-ap, abrangencia: ap, cargo: 1, limite_candidatos: 2, exporters: [] }
  - { nome: mapa-ba, abrangencia: ba, cargo: 1, limite_candidatos: 2, exporters: [] }
  - { nome: mapa-ce, abrangencia: ce, cargo: 1, limite_candidatos: 2, exporters: [] }
  - { nome: mapa-df, abrangencia: df, cargo: 1, limite_candidatos: 2, exporters: [] }
  - { nome: mapa-es, abrangencia: es, cargo: 1, limite_candidatos: 2, exporters: [] }
  - { nome: mapa-go, abrangencia: go, cargo: 1, limite_candidatos: 2, exporters: [] }
  - { nome: mapa-ma, abrangencia: ma, cargo: 1, limite_candidatos: 2, exporters: [] }
  - { nome: mapa-mg, abrangencia: mg, cargo: 1, limite_candidatos: 2, exporters: [] }
  - { nome: mapa-ms, abrangencia: ms, cargo: 1, limite_candidatos: 2, exporters: [] }
  - { nome: mapa-mt, abrangencia: mt, cargo: 1, limite_candidatos: 2, exporters: [] }
  - { nome: mapa-pa, abrangencia: pa, cargo: 1, limite_candidatos: 2, exporters: [] }
  - { nome: mapa-pb, abrangencia: pb, cargo: 1, limite_candidatos: 2, exporters: [] }
