# ---------------------------------------------------------------------------
# AS TRES TARJAS — um arquivo JSON por tarja, formato RASO
#
# No LiveBoard cada item da cena e assinado a um campo. Este arquivo produz o
# formato com menos chance de vinculo errado: um objeto PLANO, sem estrutura
# aninhada e sem indice de array. Cada item da cena aponta para uma chave
# unica, escrita do mesmo jeito que aparece no JSON.
#
#   tarja 1  presidente, com foto      -> tarja-presidente.json
#   tarja 2  senador e governador      -> tarja-<alvo>.json (um por praca)
#   tarja 3  rodizio de 10 estados     -> tarja-rodizio.json (lista)
#
# Rode 'gctse -c config/config.tarjas.yaml celulas' para o mapa de vinculos.
# ---------------------------------------------------------------------------

log: {nivel: INFO, arquivo: logs/gctse.log}

tse:
  base_url: https://resultados.tse.jus.br/oficial
  ciclo: ele2026
  pleito: "000"     # <- gctse descobrir
  eleicao: "000"    # <- gctse descobrir
  turno: 1

coleta:
  fonte: tse
  intervalo_segundos: 20
  paralelismo: 4
  timeout_segundos: 8
  tentativas: 3
  cache_condicional: true
  arquivo_estado: dados/estado/estado.json
  arquivo_saude: dados/estado/saude.json
  arquivo_painel: dados/estado/painel.html

seguranca:
  bloquear_nao_oficial: true
  bloquear_regressao: true

texto:
  caixa: alta
  formatar_numeros: true
  separador_milhar: "."
  casas_percentual: 2
  sufixo_percentual: "%"
  selo_nao_oficial: "PARCIAL - NAO OFICIAL"
  padrao_foto: "fotos/{numero}.png"
  cor_padrao: "#6b86ab"
  cores_partido: {}          # ex.: { PVL: "#4a90d9" }
  limites: {nome: 22, partido: 12, cargo: 24, abrangencia: 24}

saida: {destino: dados/saida, encoding: utf-8, quebra_linha: crlf}

exporters:

  # --- TARJA 1 · presidente, com foto ------------------------------------
  # Campos exatamente os que a arte mostra. Menos campo = menos vinculo para
  # conferir no D-1.
  tarja_presidente:
    tipo: classx
    formato: json
    estrutura: plano
    ordem: colocacao
    slots: 2
    destino: dados/saida/tarjas
    nome_arquivo: "tarja-presidente"
    barra: {trilho_px: 300, minimo_px: 6}
    campos_resumo: [cargo, abrangencia, apuracao_pct, selo, hora_atualizacao]
    campos_candidato: [visivel, nome, partido, foto, percentual, barra_px, cor, eleito]

  # --- TARJA 2 · senador e governador, sem foto --------------------------
  # Mesma cena para os dois cargos; muda so o arquivo de origem.
  tarja_majoritaria:
    tipo: classx
    formato: json
    estrutura: plano
    ordem: colocacao
    slots: 2
    destino: dados/saida/tarjas
    nome_arquivo: "tarja-{alvo}"
    barra: {trilho_px: 560, minimo_px: 6}
    campos_resumo: [cargo, abrangencia, apuracao_pct, selo, hora_atualizacao]
    campos_candidato: [visivel, nome, partido, percentual, barra_px, cor, eleito]

  # --- TARJA 3 · rodizio, no ar o tempo todo -----------------------------
  # Uma lista com um registro por praca. Nome mais curto: a tarja e estreita.
  tarja_rodizio:
    tipo: rodizio
    formato: json
    destino: dados/saida/tarjas
    barra: {trilho_px: 0}      # esta tarja nao tem barra
    texto:
      limites: {nome: 14}      # AFIRA no ar: aqui o nome trunca cedo
    campos: [ordem, visivel, praca, cargo, apuracao_pct, selo,
             cand1_nome, cand1_partido, cand1_percentual, cand1_cor,
             cand2_nome, cand2_partido, cand2_percentual, cand2_cor]

alertas:
  ativo: false
  webhook_url: ${ALERTA_WEBHOOK_URL}

mapeamento: {}

alvos:
  - {nome: presidente-br, abrangencia: br, cargo: 1, exporters: [tarja_presidente]}

  - {nome: gov-pr, abrangencia: pr, cargo: 3, apelido_abrangencia: "PARANÁ",
     exporters: [tarja_majoritaria]}
  - {nome: sen-pr, abrangencia: pr, cargo: 5, apelido_abrangencia: "PARANÁ",
     exporters: [tarja_majoritaria]}

  # Pracas do rodizio: coletadas so para a lista, sem arquivo proprio.
  # AJUSTAR para os 10 estados que vao ao ar.
  - {nome: rod-pr, abrangencia: pr, cargo: 3, apelido_abrangencia: "PARANÁ", exporters: []}
  - {nome: rod-sp, abrangencia: sp, cargo: 3, apelido_abrangencia: "SÃO PAULO", exporters: []}
  - {nome: rod-rj, abrangencia: rj, cargo: 3, apelido_abrangencia: "RIO DE JANEIRO", exporters: []}
  - {nome: rod-mg, abrangencia: mg, cargo: 3, apelido_abrangencia: "MINAS GERAIS", exporters: []}
  - {nome: rod-sc, abrangencia: sc, cargo: 3, apelido_abrangencia: "SANTA CATARINA", exporters: []}
  - {nome: rod-rs, abrangencia: rs, cargo: 3, apelido_abrangencia: "RIO GRANDE DO SUL", exporters: []}
  - {nome: rod-ba, abrangencia: ba, cargo: 3, apelido_abrangencia: "BAHIA", exporters: []}
  - {nome: rod-go, abrangencia: go, cargo: 3, apelido_abrangencia: "GOIÁS", exporters: []}
  - {nome: rod-pe, abrangencia: pe, cargo: 3, apelido_abrangencia: "PERNAMBUCO", exporters: []}
  - {nome: rod-ce, abrangencia: ce, cargo: 3, apelido_abrangencia: "CEARÁ", exporters: []}

rodizios:
  estados:
    exporter: tarja_rodizio
    nome_arquivo: tarja-rodizio
    alvos: [rod-pr, rod-sp, rod-rj, rod-mg, rod-sc,
            rod-rs, rod-ba, rod-go, rod-pe, rod-ce]
