# ---------------------------------------------------------------------------
# TELAO - telas de apuracao para o switcher (1920x1080) e para o monitor de
# cena (1080x1920).
#
# Este arquivo e SO do telao. O gctse, que alimenta as tarjas do gerador de
# caracteres, tem a config dele e nao le esta.
#
#   ===================================================================
#    MODO DE OPERACAO - a unica linha que voce troca entre teste e ar
#   ===================================================================
#
#   modo: simulado   nos dias de TESTE do TSE. Aceita boletim em fase 'S' e
#                    carimba TODAS as telas com um selo que nao desliga.
#   modo: producao   no dia da eleicao. So aceita fase 'O'. E o padrao: se
#                    esta linha sumir ou vier errada, vale producao - esquecer
#                    de escolher tem de cair no lado seguro.
#
#   Para trocar sem editar este arquivo, use os atalhos:
#       TELAO-SIMULADO.bat      ou   telao.exe modo simulado
#       TELAO-PRODUCAO.bat      ou   telao.exe modo producao
#
#   NAO confunda com 'coleta.fonte':
#       modo: simulado  + fonte: tse         -> TSE de verdade, dado de teste
#       fonte: simulador                     -> dado inventado, sem internet
#
# O que fazer, na ordem:
#   1. telao descobrir        pega os codigos do pleito no TSE
#   2. preencha os codigos do modo que vai usar, na secao 'modos' abaixo
#   3. telao validar          confere tudo antes do ar
#   4. telao ensaio           treina com dado inventado, sem tocar o TSE
#   5. TELAO-SIMULADO.bat     nos dias de teste
#   6. TELAO-PRODUCAO.bat     no dia da eleicao
# ---------------------------------------------------------------------------

modo: producao

# Os codigos de cada modo. O simulado do TSE costuma sair em caminho e codigo
# de pleito proprios - por isso cada modo tem os seus. Preencher os dois agora
# significa que trocar de teste para o ar e UMA LINHA, e nao uma edicao de
# config sob pressao no domingo a noite.
modos:
  simulado:
    tse:
      # <- PREENCHER com o que o TSE publicar para os dias de teste.
      #    'telao descobrir' lista os pleitos disponiveis.
      ciclo: ele2026
      pleito: "000"
      eleicao: "000"
    # O selo que carimba todas as telas neste modo. Nao pode ser desligado.
    selo: "SIMULADO — TESTE, NÃO É RESULTADO"

  producao:
    tse:
      # <- PREENCHER com os codigos oficiais do pleito.
      ciclo: ele2026
      pleito: "000"
      eleicao: "000"

log:
  nivel: INFO
  arquivo: logs/telao.log

# Comum aos dois modos. O que muda (ciclo, pleito, eleicao) esta em 'modos'.
tse:
  base_url: https://resultados.tse.jus.br/oficial
  turno: 1

# O telao sempre quer a mesma coisa: o resultado nacional e o dos estados para
# UM cargo. Voce diz o cargo; as 28 pracas saem sozinhas.
apuracao:
  cargo: 1          # 1 Presidente | 3 Governador | 5 Senador
  turno: 1
  estados: todos    # 'todos' (as 27) ou uma lista: [pr, sc, rs, sp]

coleta:
  fonte: tse                 # tse | simulador
  intervalo_segundos: 20     # o TSE totaliza em ciclos de ~30-60s
  paralelismo: 8             # sao 28 arquivos por ciclo
  timeout_segundos: 8
  tentativas: 3
  cache_condicional: true    # ETag: a maioria das respostas volta 304, sem corpo
  falhas_para_alerta: 3
  # Serie temporal do nacional, usada pela previsao de fechamento.
  historico: true

seguranca:
  # A trava de fase NAO fica aqui: ela e decidida pelo modo, e producao a liga
  # sempre - nao ha valor nesta config que faca um simulado ir ao ar como
  # resultado.
  #
  # Esta continua sua: a CDN do TSE pode servir copia antiga de um no
  # diferente, e sem ela o numero no telao anda para tras no ar.
  bloquear_regressao: true

saida:
  destino: telao             # a pasta que o PC de exibicao vai abrir
  intervalo_tela_segundos: 8 # de quanto em quanto a tela rele o desenho

aparencia:
  fonte: "Barlow Condensed, Arial Narrow, Helvetica, sans-serif"
  cor_fundo: "#0b1220"
  cor_escala: "#2f97e8"      # cor cheia no mapa de urnas totalizadas
  selo_nao_oficial: "PARCIAL — NÃO OFICIAL"
  credito_malha: true        # o credito da malha e exigido pela licenca

  # Cor por partido. E o que pinta cada estado no mapa de lideranca - a
  # pergunta principal deste sistema.
  #
  # AJUSTAR COM A ARTE antes do D-7. Duas regras que evitam retrabalho:
  #  1. a mesma sigla tem a mesma cor em toda a programacao, do placar ao mapa;
  #  2. partidos vizinhos no mapa precisam ser distinguiveis no ar - inclusive
  #     por quem nao separa vermelho de verde, que e 1 em cada 12 homens.
  #     Imprima o mapa em preto e branco: se dois estados vizinhos viram o
  #     mesmo cinza, o telespectador tambem perde.
  #
  # Sem cor definida, o partido recebe uma da paleta de reserva - serve para
  # ensaiar, nao e decisao de arte.
  cores_partido: {}          # ex.: { PVL: "#2f97e8", PDR: "#c0392b" }
  cor_padrao: "#7d93b3"
  paleta_reserva: true

# ---------------------------------------------------------------------------
# MONITOR VERTICAL da cena - 1080x1920, roda sozinho.
#
# Outro problema, outra secao: o telao do switcher tem alguem escolhendo na
# mesa; o monitor de cena fica em quadro o tempo todo, atras do apresentador,
# sem ninguem operando. Entao ele gira como apresentacao de slides.
#
# Cada tela tem UM assunto, em corpo grande - quem olha de relance, no meio de
# uma entrevista, le um numero, nao uma tabela.
#
# Abrir no monitor: TELAO-VERTICAL.bat
# ---------------------------------------------------------------------------
vertical:
  ativo: true
  destino: telao-vertical
  rodizio_segundos: 10
  limite_candidatos: 5

  # A ordem do giro. Apague o que nao quiser em cena.
  #   urnas           urnas apuradas no Brasil
  #   brancos-nulos   brancos e nulos, em rosca
  #   comparecimento  quem foi votar e quem nao foi
  #   placar          os candidatos, em lista
  #   mapa            o mapa por cor de partido, com legenda
  #   estados         as 27 UFs em coluna: quem lidera em cada uma
  telas: [urnas, brancos-nulos, comparecimento, placar, mapa, estados]

# As telas, na ordem em que aparecem na mesa e nas teclas 1..6 da exibicao.
# Apague o que nao for usar: menos tela e menos coisa para escolher errado
# no meio do bloco.
telas:
  - id: lideranca
    tipo: lideranca
    titulo: "LIDERANÇA POR ESTADO"

  - id: estados
    tipo: estados
    titulo: "COMO CADA ESTADO VOTOU"

  - id: como-votou
    tipo: como-votou
    titulo: "COMO O BRASIL VOTOU"

  - id: apuracao-nacional
    tipo: apuracao-nacional
    titulo: "APURAÇÃO NACIONAL"

  - id: apuracao-estados
    tipo: apuracao-estados
    titulo: "APURAÇÃO POR ESTADO"

  - id: placar
    tipo: placar
    titulo: "PRESIDENTE — BRASIL"
    limite_candidatos: 6
