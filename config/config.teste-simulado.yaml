# ---------------------------------------------------------------------------
# TESTE COM O SIMULADO DO TSE
#
# Arquivo SEPARADO de proposito. O teste precisa aceitar boletim em fase 'S',
# e essa trava nunca deve ser desligada na config de producao - alguem esquece
# de religar e um simulado vai ao ar como resultado. Aqui ela esta desligada,
# a saida aponta para uma pasta de TESTE, e nada disso encosta no config.yaml.
#
# ANTES DE RODAR: o PC precisa alcancar resultados.tse.jus.br na porta 443.
# Sem isso o teste nao acontece. Confira com antecedencia.
#
# SEQUENCIA (detalhes em docs/TESTE-SIMULADO.md):
#   1. gctse -c config/config.teste-simulado.yaml descobrir
#      -> anote os codigos e preencha 'pleito' e 'eleicao' abaixo
#   2. gctse -c config/config.teste-simulado.yaml validar
#   3. gctse -c config/config.teste-simulado.yaml inspecionar --abrangencia br --cargo 1
#      -> confira as chaves; ajuste 'mapeamento' se algo mudou
#   4. gctse -c config/config.teste-simulado.yaml amostrar
#      -> GRAVE AS AMOSTRAS. Depois da janela do simulado elas nao voltam.
#   5. gctse -c config/config.teste-simulado.yaml rodar
#      -> abra dados/teste-simulado/painel.html e acompanhe
# ---------------------------------------------------------------------------

log:
  nivel: INFO
  arquivo: logs/teste-simulado.log

tse:
  base_url: https://resultados.tse.jus.br/oficial
  ciclo: ele2026
  pleito: "000"     # <- passo 1
  eleicao: "000"    # <- passo 1
  turno: 1

coleta:
  fonte: tse
  intervalo_segundos: 20
  paralelismo: 4
  timeout_segundos: 10
  tentativas: 3
  cache_condicional: true
  arquivo_estado: dados/teste-simulado/estado.json
  arquivo_saude: dados/teste-simulado/saude.json
  arquivo_painel: dados/teste-simulado/painel.html
  pasta_amostras: dados/amostras
  falhas_para_alerta: 5
  segundos_sem_dado_para_alerta: 0   # no simulado o TSE pausa; nao alarmar

seguranca:
  bloquear_nao_oficial: false   # o simulado VEM em fase 'S'; e o ponto do teste
  bloquear_regressao: true
  pct_minimo_para_publicar: 0

texto:
  caixa: alta
  formatar_numeros: true
  separador_milhar: "."
  casas_percentual: 2
  sufixo_percentual: "%"
  selo_nao_oficial: "TESTE - SIMULADO TSE"
  padrao_foto: "fotos/{numero}.png"
  cor_padrao: "#7d93b3"
  limites:
    nome: 22
    partido: 12

saida:
  destino: dados/teste-simulado    # NAO e a pasta do ar
  encoding: utf-8
  quebra_linha: crlf

exporters:
  gc:
    tipo: classx
    formato: json
    ordem: colocacao
    slots: 6
    destino: dados/teste-simulado/gc
    nome_arquivo: "{alvo}"
    barra: {trilho_px: 420, minimo_px: 6}

  rodizio_uf:
    tipo: rodizio
    formato: json
    destino: dados/teste-simulado/gc
    barra: {trilho_px: 420, minimo_px: 6}

  bruto:
    tipo: json
    formato: bruto        # o JSON do TSE como veio, para comparar na mao
    destino: dados/teste-simulado/bruto
    nome_arquivo: "{alvo}"

alertas:
  ativo: false

mapeamento: {}    # passo 3 preenche isto, se precisar

padroes_alvo:
  turno: 1
  exporters: [gc, bruto]

# AJUSTAR as pracas. Comece pequeno: BR + duas UFs. Depois de a cadeia fechar,
# amplie para as 10 do rodizio.
alvos:
  - {nome: presidente-br, abrangencia: br, cargo: 1}
  - {nome: gov-pr, abrangencia: pr, cargo: 3, apelido_abrangencia: "PARANÁ"}
  - {nome: gov-sp, abrangencia: sp, cargo: 3, apelido_abrangencia: "SÃO PAULO"}
  - {nome: sen-pr, abrangencia: pr, cargo: 5, apelido_abrangencia: "PARANÁ"}

rodizios:
  governadores:
    exporter: rodizio_uf
    nome_arquivo: rodizio-governador
    alvos: [gov-pr, gov-sp]
