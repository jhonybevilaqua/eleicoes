# Compila o executavel Windows. Roda em runner Windows porque PyInstaller nao
# faz compilacao cruzada: um .exe precisa ser construido no Windows.
#
# Como baixar o resultado:
#   GitHub -> aba Actions -> "Executavel Windows" -> ultima execucao ->
#   secao Artifacts -> telao-windows.zip
#
# Marcar uma tag (git tag v2.0.0 && git push --tags) publica o mesmo zip
# como Release, que fica com link fixo e nao expira.

name: Executavel Windows

on:
  workflow_dispatch:        # botao "Run workflow" na aba Actions
  push:
    branches: ["claude/**"]
    tags: ["v*"]

permissions:
  contents: write           # necessario para publicar a Release na tag

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Rodar os testes
        run: python -m pytest tests -q
        env:
          PYTHONPATH: src

      - name: Compilar o executavel
        run: >
          python -m PyInstaller
          --name telao --onedir --console --noconfirm --clean
          --paths src
          --hidden-import telao.mapa
          --hidden-import telao.telas
          --hidden-import telao.vertical
          --hidden-import telao.mesa
          --hidden-import tkinter
          telao_launcher.py

      - name: Montar a pasta de distribuicao
        shell: pwsh
        run: |
          $alvo = "dist\telao"
          New-Item -ItemType Directory -Force -Path "$alvo\docs" | Out-Null
          Copy-Item config\telao.yaml "$alvo\"
          Copy-Item docs\*.md "$alvo\docs\"
          Copy-Item empacotamento\*.bat "$alvo\"
          Copy-Item empacotamento\LEIA-ME.txt "$alvo\"

      - name: Conferir as telas
        shell: pwsh
        working-directory: dist\telao
        run: |
          .\telao.exe --version
          # Prova que as doze telas saem desenhadas, sem tocar o TSE. Vai para
          # FORA do pacote, em pasta temporaria: a conferencia usa chapa
          # ficticia, e nada ficticio pode viajar no zip.
          $prova = Join-Path $env:RUNNER_TEMP "prova"
          .\telao.exe -c telao.yaml exemplo --pasta $prova --progresso 63
          $svgs = Get-ChildItem "$prova\*.svg"
          if ($svgs.Count -lt 6) { throw "faltaram telas: $($svgs.Count)" }
          Get-ChildItem $prova | Select-Object Length, Name | Format-Table -AutoSize
          $verticais = Get-ChildItem "$prova\vertical\*.svg"
          if ($verticais.Count -lt 6) { throw "faltaram telas verticais: $($verticais.Count)" }
          Get-ChildItem "$prova\vertical" | Select-Object Length, Name | Format-Table -AutoSize

      - name: Semear as telas em branco
        shell: pwsh
        working-directory: dist\telao
        run: |
          # O que VIAJA no pacote: pagina e telas desenhadas, sem dado nenhum.
          # Assim os PCs de exibicao podem ser montados e apontados hoje -
          # abrem, mostram o desenho vazio e esperam o boletim - em vez de dar
          # "arquivo nao encontrado" ate a coleta rodar pela primeira vez.
          .\telao.exe -c telao.yaml exemplo --em-branco
          $svgs = Get-ChildItem telao\*.svg
          if ($svgs.Count -lt 6) { throw "telao nao foi semeado: $($svgs.Count)" }
          if (-not (Test-Path "telao\index.html")) { throw "faltou a pagina de exibicao" }
          Get-ChildItem telao | Select-Object Length, Name | Format-Table -AutoSize
          Get-ChildItem telao-vertical | Select-Object Length, Name | Format-Table -AutoSize

      - name: Conferir o pacote
        shell: pwsh
        working-directory: dist\telao
        run: |
          .\telao.exe modo             # mostra em que modo o pacote sai de fabrica
          # O pacote tem de subir SEM ninguem editar config. Se a saida trouxer
          # 'FALTA PREENCHER', alguem deixou um codigo por preencher e a
          # operacao descobriria isso no dia, no PC, sob pressao.
          foreach ($modo in @("producao","simulado")) {
            $env:TELAO_MODO = $modo
            $saida = .\telao.exe -c telao.yaml validar 2>&1 | Out-String
            Write-Host $saida
            if ($LASTEXITCODE -ne 0) { throw "validar falhou no modo $modo" }
            if ($saida -match "FALTA PREENCHER") { throw "config pendente no modo $modo" }
          }
          $env:TELAO_MODO = $null
          Write-Host "A config sobe nos dois modos, sem edicao: OK"

          Write-Host "=== Raiz do pacote (o que a pessoa ve ao extrair) ==="
          Get-ChildItem | Where-Object { $_.Name -ne "_internal" } |
            Select-Object Mode, Length, Name | Format-Table -AutoSize
          foreach ($f in @("TELAO-SIMULADO.bat","TELAO-PRODUCAO.bat","TELAO-TELA.bat",
                           "TELAO-VERTICAL.bat","TELAO-MESA.bat","TELAO-ENSAIO.bat",
                           "LEIA-ME.txt","telao.yaml","telao.exe")) {
            if (-not (Test-Path $f)) { throw "faltou $f no pacote" }
          }
          # Nenhum arquivo entregue pode carregar chapa de ensaio: e a garantia
          # de que o pacote so mostra o que vier do TSE.
          $suspeitos = Get-ChildItem -Recurse -File -Include *.json,*.csv,*.xml,*.svg |
            Where-Object { $_.FullName -notmatch "_internal" } |
            Select-String -Pattern "CANDIDATO ENSAIO|GOVERNO ENSAIO|SENADO ENSAIO" -List
          if ($suspeitos) { throw "dado ficticio no pacote: $($suspeitos.Path -join ', ')" }
          Write-Host "Pacote sem dado inventado: OK"
          # E nada de pasta sobrando na raiz.
          $previstas = @("docs","logs","telao","telao-vertical","_internal")
          $sobrando = Get-ChildItem -Directory |
            Where-Object { $previstas -notcontains $_.Name }
          if ($sobrando) { throw "pasta inesperada no pacote: $($sobrando.Name -join ', ')" }
          Write-Host "Raiz do pacote sem pasta sobrando: OK"

      - name: Publicar o zip como artefato
        uses: actions/upload-artifact@v4
        with:
          name: telao-windows
          path: dist/telao
          retention-days: 90

      - name: Publicar Release (somente em tag)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: Compress-Archive -Path dist\telao\* -DestinationPath telao-windows.zip

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: telao-windows.zip
          body: |
            Telas de apuracao do TSE, executavel Windows autocontido.
            Nao precisa de Python instalado.

            Baixe o zip, extraia numa pasta e rode `telao.exe validar`.
            Passo a passo em `LEIA-ME.txt`.
