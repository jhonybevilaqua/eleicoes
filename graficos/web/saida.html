<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>SAIDA</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #0b1220; overflow: hidden; cursor: none; }
  #palco { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  /* OBS da saida vertical (?obs=1): fonte 1920x1080; a tela em pe
     (1080x1920) vai girada dentro dela - o OBS nao precisa girar nada. */
  #palco.em-pe { left: 50%; top: 50%; width: 100vh; height: 100vw; }
  #palco.g90 { transform: translate(-50%, -50%) rotate(90deg); }
  #palco.gm90 { transform: translate(-50%, -50%) rotate(-90deg); }
  #palco.g0 { transform: translate(-50%, -50%) scale(0.5625); }
  iframe { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity .4s ease-in-out; pointer-events: none; }
  iframe.on { opacity: 1; }
</style>
</head>
<body>
<div id="palco"><iframe id="f0" title="saida"></iframe><iframe id="f1" title="saida"></iframe></div>
<script>
// Saida de uma DeckLink (pelo OBS): mostra o que o operador escolheu no
// GERENCIADOR. ?saida=h (horizontal, fonte 1920x1080) ou ?saida=v (vertical,
// fonte 1080x1920; no OBS automatico: ?saida=v&obs=1, fonte 1920x1080 ja
// girada). Le /estado do gerenciador a cada 0,7 s.
(function () {
  "use strict";
  var q = new URLSearchParams(location.search);
  var saida = q.get("saida") === "v" ? "v" : "h";
  var sufixo = saida === "v" ? "vertical" : "horizontal";
  var quadros = [document.getElementById("f0"), document.getElementById("f1")];
  var palco = document.getElementById("palco"), noObs = saida === "v" && q.get("obs") === "1", giro = null;

  // Saida vertical no OBS: gira conforme o botao do gerenciador.
  function girar(g) {
    if (!noObs || g === giro) return;
    giro = g;
    palco.className = "em-pe " + (g === -90 ? "gm90" : g === 0 ? "g0" : "g90");
  }
  if (noObs) girar(90);
  var visivel = -1, seqAtual = null, aseqAtual = null, telaAtual = "";

  // A posicao do giro/resumo vai na URL: a tela ja abre no estado / na tela
  // certa (e a previa do gerenciador mostra exatamente o mesmo).
  function endereco(tela, acao, rodizio, tempo) {
    acao = acao || "";
    if (tela === "apresentacao") {
      // telas e tempo escolhidos no gerenciador (vazio = apresentacao-config.js)
      var p = [];
      if (rodizio) p.push("lista=" + encodeURIComponent(rodizio));
      if (tempo >= 3) p.push("tempo=" + tempo);
      return "apresentacao-" + sufixo + ".html" + (p.length ? "?" + p.join("&") : "");
    }
    // giro so do Governador: "uf:pr" (estado fixo) ou "reg:pr,rs,sc" (troca entre eles)
    if (tela === "girogov") return "giro-estados-" + sufixo + ".html?so=gov" + (acao.indexOf("uf:") === 0 ? "&uf=" + encodeURIComponent(acao.slice(3)) :
      acao.indexOf("reg:") === 0 ? "&ordem=" + encodeURIComponent(acao.slice(4)) + "&auto=1" : "");
    if (tela === "giro") return "giro-estados-" + sufixo + ".html" + (acao.indexOf("uf:") === 0 ? "?uf=" + encodeURIComponent(acao.slice(3)) : "");
    if (tela === "resumo") {
      if (acao.indexOf("estado:") === 0) return "resumo-" + sufixo + ".html?tela=estado&uf=" + encodeURIComponent(acao.slice(7));
      return "resumo-" + sufixo + ".html" + (acao.indexOf("tela:") === 0 ? "?tela=" + encodeURIComponent(acao.slice(5)) : "");
    }
    // grafico com alvo (Presidente | estado ou regiao): acao "alvo:sp"
    if (/^[a-z0-9-]+$/.test(tela)) return "grafico.html?g=" + encodeURIComponent(tela) + (acao.indexOf("alvo:") === 0 ? "&a=" + encodeURIComponent(acao.slice(5)) : "") +
      (acao.indexOf("dep:") === 0 ? "&dep=" + encodeURIComponent(acao.slice(4)) : "");
    return null;
  }

  // Quadro com a tela de verdade? (pagina de erro do navegador = nao)
  function quadroOk(f) {
    try {
      var d = f.contentWindow.document;
      // nossas telas sempre tem #palco (apresentacao, giro, resumo) ou #tela (grafico)
      return !!(d && d.readyState === "complete" && (d.getElementById("palco") || d.getElementById("tela")));
    } catch (e) { return false; }
  }
  var pedidoAtual = null, tentarDeNovo = null;

  // Carrega a tela nova no quadro escondido e so entao troca (sem piscar).
  // Se a tela nao carregar (gerenciador reiniciando, por exemplo), tenta de
  // novo em 3 s e mantem no ar a que estava.
  function trocar(tela, acao, rodizio, tempo) {
    var url = endereco(tela, acao, rodizio, tempo);
    if (!url) return;
    pedidoAtual = [tela, acao, rodizio, tempo];
    clearTimeout(tentarDeNovo);
    var prox = quadros[visivel === 0 ? 1 : 0];
    prox.onload = function () {
      prox.onload = null;
      if (!quadroOk(prox)) {
        tentarDeNovo = setTimeout(function () { if (pedidoAtual) trocar.apply(null, pedidoAtual); }, 3000);
        return;
      }
      prox.classList.add("on");
      if (visivel >= 0) quadros[visivel].classList.remove("on");
      var antigo = visivel >= 0 ? quadros[visivel] : null;
      visivel = quadros.indexOf(prox);
      // libera a tela antiga depois da fusao
      if (antigo) setTimeout(function () { if (!antigo.classList.contains("on")) antigo.src = "about:blank"; }, 800);
    };
    prox.src = url;
    telaAtual = tela;
  }

  // Comando para o giro / resumo que esta no ar.
  function comando(acao) {
    if (visivel < 0) return;
    var w = quadros[visivel].contentWindow, c = null;
    try { c = w.GCTSE_GIRO_CONTROLE || w.GCTSE_RESUMO_CONTROLE || w.GCTSE_GRAFICO_CONTROLE; } catch (e) { return; }
    if (!c) return;
    if (acao.indexOf("dep:") === 0) { if (c.deputados) c.deputados(acao.slice(4)); return; }
    if (acao === "proximo") c.proximo();
    else if (acao === "anterior") c.anterior();
    else if (acao === "auto" && c.alternarAuto) c.alternarAuto();
    else if (acao.indexOf("estado:") === 0 && c.estado) c.estado(acao.slice(7));
    else if (acao.indexOf("uf:") === 0 && c.irPara) c.irPara(acao.slice(3));
    else if (acao.indexOf("tela:") === 0 && c.irPara) c.irPara(acao.slice(5));
  }

  function ler() {
    fetch("/estado?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (e) {
      if (typeof e.girar_v === "number") girar(e.girar_v);
      var s = e[saida];
      if (!s) return;
      if (s.seq !== seqAtual) { seqAtual = s.seq; aseqAtual = s.aseq; trocar(s.tela, s.acao, s.rodizio, s.tempo); return; }
      if (s.aseq !== aseqAtual) { aseqAtual = s.aseq; if (s.acao) comando(s.acao); }
    }).catch(function () { /* gerenciador fechado: fica no que esta no ar */ });
  }
  // PREVIA do gerenciador (?previa=1&tela=...&acao=...): mostra a tela
  // escolhida ANTES de cortar para o ar, pelo mesmo endereco que vai ao ar.
  // Nao le /estado: nao segue o que esta no ar.
  if (q.get("previa") === "1") trocar(q.get("tela") || "", q.get("acao") || "", q.get("rodizio") || "", +q.get("tempo") || 0);
  else { ler(); setInterval(ler, 700); }
  // Vigia: se a tela no ar sumir (pagina de erro, quadro vazio), recarrega.
  setInterval(function () {
    if (!pedidoAtual) return;
    if (visivel < 0 || !quadroOk(quadros[visivel])) trocar.apply(null, pedidoAtual);
  }, 10000);
})();
</script>
</body>
</html>
