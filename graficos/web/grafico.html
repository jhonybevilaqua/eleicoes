<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>gctse grafico</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1220; overflow: hidden; }
  #tela { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  #tela svg { width: 100%; height: 100%; display: block; }
  /* Botao so aparece com o mouse em cima: a captura no ar sai limpa. */
  #png { position: fixed; top: 12px; right: 12px; padding: 8px 14px; border: 0; border-radius: 6px;
         background: #2f8fdd; color: #fff; font: 700 14px 'Segoe UI', Arial, sans-serif; cursor: pointer;
         opacity: 0; transition: opacity .2s; }
  body.mouse #png { opacity: 1; }
</style>
<script>
  // SALVAR-TELAS (3.28.2): ?exportar=LxA fixa o tamanho da pagina em pixels
  // (o navegador sem janela tem a area visivel menor que a imagem). No ar,
  // sem o parametro, nada muda.
  (function () { var m = /[?&]exportar=(\d+)x(\d+)/.exec(location.search); if (!m) return;
    var w = m[1] + "px", h = m[2] + "px";
    document.write("<style>html,body,#tela,#palco{width:" + w + " !important;height:" + h + " !important}#palco{position:absolute !important;left:0;top:0}</style>"); })();
</script>
</head>
<body>
<div id="tela"></div>
<button id="png" title="Tecla P">Salvar PNG</button>
<script charset="utf-8" src="mapa-brasil.js"></script>
<script charset="utf-8" src="fotos-config.js"></script>
<script charset="utf-8" src="fotos-tse/indice.js"></script>
<script charset="utf-8" src="senado-config.js"></script>
<script charset="utf-8" src="camara-config.js"></script>
<script charset="utf-8" src="deputados-config.js"></script>
<script charset="utf-8" src="candidatos-genero.js"></script>
<script charset="utf-8" src="perfil-eleitor.js"></script>
<script charset="utf-8" src="comparativo-config.js"></script>
<script charset="utf-8" src="estados.js"></script>
<script charset="utf-8" src="exterior-paises.js"></script>
<script charset="utf-8" src="graficos.js"></script>
<script charset="utf-8" src="dados.js"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var id = q.get("g") || "presidente-h";
  var tela = document.getElementById("tela");
  var ultimo = "";
  // Camara e comparativo tambem leem estados.js (coletor ESTADOS.bat).
  var usaEstados = /^(camara|comparativo|deputados|governadores|govpartido|mulheres|senadores|gov2t|gov12|govpres|perfilcamara|assembleia|turno22|topdep|topfem|topsenfem|mudou22|abst22|menosvot|senvotos|gov22|exterior|excidades|governab|cruzado|pendulo|definicao)/.test(id);
  // 3.28: mapa por municipio - a malha do IBGE (1,9 MB) e o resultado das
  // cidades (MUNICIPIOS.bat) so carregam nesta tela.
  var usaMun = /^munmapa/.test(id);
  if (usaMun) { ["mapa-municipios.js", "municipios.js"].forEach(function (a) { var sm = document.createElement("script"); sm.charset = "utf-8"; sm.src = a; sm.onload = function () { ultimo = ""; desenhar(); }; document.head.appendChild(sm); }); }
  // Deputados: a tela troca sozinha (deputados-config.js, "segundos").
  var paginada = /^deputados/.test(id);

  function desenhar() {
    var d = window.GCTSE_GRAFICOS.dados();
    var e = window.GCTSE_ESTADOS || {};
    var pg = paginada ? window.GCTSE_GRAFICOS.pagina(id) : "";
    var chave = JSON.stringify([d.modo, d.br, d.ufs, d.capitais, d.exterior, d.exterior_total, d.cor_slot, d.cores, usaEstados ? [e.camara, e.ref2022, e.ref2022_2t, e.ref2022_gov, e.assembleia, e.ufs, e.definicoes_gov] : 0, d.turno1, pg, d.definicao, usaMun ? [(window.GCTSE_MUN || {}).gravado_em, !!window.MAPA_MUN] : 0]);
    if (chave === ultimo) return;       // so redesenha quando o dado mudou
    var trocouPagina = paginada && ultimo && JSON.parse(ultimo)[7] !== pg;
    ultimo = chave;
    if (trocouPagina) {                 // troca de tela: apaga, redesenha, acende
      tela.style.transition = "opacity .25s"; tela.style.opacity = 0;
      setTimeout(function () { ultimo = ""; desenhar(); tela.style.opacity = 1; }, 260);
      return;
    }
    var s = window.GCTSE_GRAFICOS.desenhar(id);
    if (!s) { tela.textContent = "grafico desconhecido: " + id; return; }
    tela.innerHTML = s;
    window.GCTSE_GRAFICOS.ajustarSelos(tela);
  }

  // Le dados.js de novo a cada 3 s. Funciona abrindo o arquivo direto
  // (file://), sem servidor: o navegador carrega script local.
  function recarregar() {
    if (usaEstados) {
      var se = document.createElement("script");
      se.charset = "utf-8";
      se.src = "estados.js?t=" + Date.now();
      se.onload = se.onerror = function () { se.remove(); };
      document.head.appendChild(se);
    }
    if (usaMun && window.MAPA_MUN && (!recarregar.mun || Date.now() - recarregar.mun > 20000)) {
      recarregar.mun = Date.now();
      var sm = document.createElement("script");
      sm.charset = "utf-8";
      sm.src = "municipios.js?t=" + Date.now();
      sm.onload = sm.onerror = function () { sm.remove(); };
      document.head.appendChild(sm);
    }
    var sc = document.createElement("script");
    sc.charset = "utf-8";
    sc.src = "dados.js?t=" + Date.now();
    sc.onload = function () { sc.remove(); desenhar(); };
    sc.onerror = function () { sc.remove(); };
    document.head.appendChild(sc);
  }

  // Fundo e logo da arte viram "data:" para entrar no PNG (imagem de
  // arquivo nao entra num SVG desenhado no canvas).
  var ARTE = {};
  [["fundo-h", "jpg"], ["fundo-v", "jpg"], ["logo", "png"]].forEach(function (a) {
    var im = new Image();
    im.onload = function () {
      try {
        var c = document.createElement("canvas"); c.width = im.naturalWidth; c.height = im.naturalHeight;
        c.getContext("2d").drawImage(im, 0, 0);
        ARTE[a[0]] = c.toDataURL(a[1] === "png" ? "image/png" : "image/jpeg", 0.9);
      } catch (e) { /* aberto direto do disco: o PNG sai sem o fundo */ }
    };
    im.src = "arte/" + a[0] + "." + a[1];
  });

  // 3.28.2: as FOTOS entram no PNG. Foto de outro site (TSE) nao entra num
  // SVG desenhado no canvas; por isso cada foto vira "data:" antes: a copia
  // guardada (fotos-tse, GUARDAR-DADOS-TSE) direto; a do TSE pelo
  // gerenciador (/foto, mesmo endereco da pagina). Sem como (tela aberta
  // direto do disco), a foto sai do PNG como antes. Todas as telas de uma
  // vez, com foto: SALVAR-TELAS.bat.
  function paraData(u, cb) {
    if (!u || /^data:/.test(u)) { cb(u || null); return; }
    var tent = [];
    if (/^https?:/i.test(u)) { if (/^http/.test(location.protocol)) tent.push("/foto?u=" + encodeURIComponent(u)); }
    else tent.push(u);
    (function prox(i) {
      if (i >= tent.length) { cb(null); return; }
      fetch(tent[i], { cache: "force-cache" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
        .then(function (b) { var fr = new FileReader(); fr.onload = function () { cb(fr.result); }; fr.onerror = function () { prox(i + 1); }; fr.readAsDataURL(b); })
        .catch(function () { prox(i + 1); });
    })(0);
  }
  function embutirFotos(el, pronto) {
    var ims = Array.prototype.filter.call(el.querySelectorAll("image"), function (im) { return !im.hasAttribute("data-arte"); });
    var falta = ims.length;
    if (!falta) { pronto(); return; }
    ims.forEach(function (im) {
      paraData(im.getAttribute("href") || im.getAttribute("xlink:href"), function (d) {
        if (d) { im.setAttribute("href", d); im.removeAttribute("onload"); im.removeAttribute("onerror"); }
        else if (im.parentNode) im.parentNode.removeChild(im);
        if (--falta === 0) pronto();
      });
    });
  }
  function salvarPNG() {
    // Desenha de novo fora da tela, com as fotos virando "data:".
    var tmp = document.createElement("div");
    tmp.style.cssText = "position:absolute;left:-99999px;top:0";
    document.body.appendChild(tmp);
    tmp.innerHTML = window.GCTSE_GRAFICOS.desenhar(id) || ""; window.GCTSE_GRAFICOS.ajustarSelos(tmp);
    var el = tmp.querySelector("svg");
    if (!el) { tmp.remove(); return; }
    Array.prototype.forEach.call(el.querySelectorAll("image[data-arte]"), function (im) {
      var d = ARTE[im.getAttribute("data-arte")];
      if (d) im.setAttribute("href", d); else im.parentNode.removeChild(im);
    });
    embutirFotos(el, function () { rasterizar(el, tmp); });
  }
  function rasterizar(el, tmp) {
    var W = +el.getAttribute("width"), H = +el.getAttribute("height");
    var escala = W > H ? 1920 / W : 1080 / W;       // 1920x1080 ou 1080x1920
    var img = new Image();
    img.onload = function () {
      var c = document.createElement("canvas");
      c.width = Math.round(W * escala); c.height = Math.round(H * escala);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(function (b) {
        var a = document.createElement("a"), agora = new Date();
        var hh = ("0" + agora.getHours()).slice(-2) + ("0" + agora.getMinutes()).slice(-2);
        a.href = URL.createObjectURL(b); a.download = id + "-" + hh + ".png";
        document.body.appendChild(a); a.click(); a.remove();
      }, "image/png");
    };
    var dado = new XMLSerializer().serializeToString(el);
    tmp.remove();
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(dado);
  }

  var timer = null;
  document.addEventListener("mousemove", function () {
    document.body.classList.add("mouse");
    clearTimeout(timer); timer = setTimeout(function () { document.body.classList.remove("mouse"); }, 2000);
  });
  document.getElementById("png").addEventListener("click", salvarPNG);
  document.addEventListener("keydown", function (e) { if (e.key === "p" || e.key === "P") salvarPNG(); });

  window.__gctseRedesenhar = function () { ultimo = ""; desenhar(); };   // foto que falhou: refaz sem ela
  // Comando do gerenciador (pela saida): deputados manual "sp:2".
  window.GCTSE_GRAFICO_CONTROLE = {
    deputados: function (v) { window.__gctseDep = v; if (window.GCTSE_GRAFICOS.reiniciarPaginas) window.GCTSE_GRAFICOS.reiniciarPaginas(); }   // o tique de 0,5 s redesenha com a troca suave
  };
  desenhar();
  setInterval(recarregar, 3000);
  if (paginada) setInterval(desenhar, 500);
})();
</script>
</body>
</html>
