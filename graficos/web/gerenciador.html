<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>gctse GERENCIADOR</title>
<style>
  /* Tema CLARO (padrao). O botao "tema escuro" no alto troca e fica lembrado. */
  :root { --fundo: #eef2f7; --cartao: #ffffff; --linha: #d3dbe6; --texto: #14202e; --apagado: #5a6b80; --link: #1f6fc0;
          --bt: #f4f7fb; --bt-borda: #c3cedb; --bt-texto: #14202e; --bt-hover: #e3eaf3;
          --azul: #1f6fc0; --azul-borda: #1a5a9c; --verde: #128a12; --verde-borda: #0c6b0c; --verm: #c62828; --verm-borda: #9e1f1f;
          --ok-f: #e2f4e2; --ok-t: #11621a; --ruim-f: #fde4e4; --ruim-t: #9e1f1f; --neutro-f: #e8edf3; --neutro-t: #5a6b80;
          --sombra: 0 1px 3px rgba(20, 32, 46, .12); }
  :root.escuro { --fundo: #0b1220; --cartao: #131c2c; --linha: #22304a; --texto: #fff; --apagado: #8ea3bd; --link: #7fb8ff;
          --bt: #22314a; --bt-borda: #2c3f5e; --bt-texto: #fff; --bt-hover: #2b3e5d;
          --azul: #2f8fdd; --azul-borda: #7fb8ff; --verde: #0ca30c; --verde-borda: #6be06b; --verm: #d03b3b; --verm-borda: #ff7a7a;
          --ok-f: #10301a; --ok-t: #7ee07e; --ruim-f: #3a1212; --ruim-t: #ffb3b3; --neutro-f: #1b2433; --neutro-t: #8ea3bd;
          --sombra: none; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto); font: 15px 'Segoe UI', Arial, sans-serif; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 14px 20px 6px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 21px; }
  header a { color: var(--link); font-size: 14px; }
  header .tema { padding: 5px 10px; font-size: 13px; }
  header .copia { margin-left: auto; font-size: 13px; } header .copia button { padding: 5px 10px; font-size: 13px; }
  #copiaMsg.ok { color: var(--ok-t); font-weight: 700; } #copiaMsg.ruim { color: var(--ruim-t); font-weight: 700; }
  #status { display: flex; gap: 10px; padding: 4px 20px 10px; flex-wrap: wrap; }
  .st { padding: 6px 12px; border-radius: 5px; font-weight: 700; font-size: 13px; }
  .st[hidden] { display: none; }
  .ok { background: var(--ok-f); color: var(--ok-t); } .ruim { background: var(--ruim-f); color: var(--ruim-t); } .neutro { background: var(--neutro-f); color: var(--neutro-t); }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 0 20px 20px; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
  .col { background: var(--cartao); border: 1px solid var(--linha); border-radius: 8px; padding: 14px; box-shadow: var(--sombra); }
  .col h2 { margin: 0; font-size: 18px; letter-spacing: 1px; }
  .col .sub { color: var(--apagado); font-size: 13px; margin: 2px 0 10px; }
  .noar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .noar b { background: var(--verm); color: #fff; padding: 3px 10px; border-radius: 4px; font-size: 13px; letter-spacing: 1px; }
  .noar span { font-size: 17px; font-weight: 700; }
  .previa { position: relative; background: #000; border-radius: 6px; overflow: hidden; margin-bottom: 12px; }
  .previa iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; pointer-events: none; }
  .grupo { color: var(--apagado); font-size: 12px; font-weight: 700; letter-spacing: 1px; margin: 10px 0 6px; }
  .botoes { display: flex; flex-wrap: wrap; gap: 6px; }
  button { background: var(--bt); color: var(--bt-texto); border: 1px solid var(--bt-borda); border-radius: 6px; padding: 9px 12px; font: 600 14px 'Segoe UI', Arial, sans-serif; cursor: pointer; }
  button:hover { background: var(--bt-hover); }
  button.ativo, button.ativo:hover { background: var(--verm); border-color: var(--verm-borda); color: #fff; }
  .controle { margin-top: 12px; padding: 10px; border: 1px solid var(--linha); border-radius: 6px; display: none; }
  .controle.on { display: block; }
  .controle .linha { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .controle .uf button { width: 52px; padding: 7px 0; }
  .controle .uf button.ativo, .controle .tl button.ativo, .girar button.ativo { background: var(--azul); border-color: var(--azul-borda); color: #fff; }
  button.auto.ligado, button.auto.ligado:hover { background: var(--verde); border-color: var(--verde-borda); color: #fff; }
  .dica { color: var(--apagado); font-size: 12px; margin-top: 6px; }
  .rodizio { margin-top: 8px; }
  .rodizio .rod-linha { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .rodizio .rod-resumo { color: var(--apagado); font-size: 13px; }
  .rod-painel { margin-top: 8px; padding: 10px; border: 1px solid var(--linha); border-radius: 6px; }
  .rod-painel[hidden] { display: none; }
  .rod-painel .opcoes { display: flex; flex-wrap: wrap; gap: 6px; }
  .rod-painel label { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid var(--bt-borda);
                      border-radius: 6px; background: var(--bt); cursor: pointer; font-size: 14px; font-weight: 600; user-select: none; }
  .rod-painel label.marcado { background: var(--azul); border-color: var(--azul-borda); color: #fff; }
  .rod-painel .uf label { width: 52px; justify-content: center; padding: 6px 0; }
  /* Governador ja ELEITO no 1o turno: verde. Cinza (padrao) = vai ao 2o turno. */
  .gov-eleito { background: #d6f2d6 !important; border-color: #2e9e2e !important; color: #11621a !important; }
  :root.escuro .gov-eleito { background: #134a1c !important; border-color: #3fbf4f !important; color: #d8ffd8 !important; }
  .controle .uf button.gov-eleito.ativo, .rod-painel label.gov-eleito.marcado { background: var(--azul) !important; border-color: #3fbf4f !important; color: #fff !important; box-shadow: inset 0 -4px 0 #3fbf4f; }
  .leg-gov { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--apagado); margin: 2px 0 6px; }
  .leg-gov i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid; }
  .rod-painel input[type=checkbox] { display: none; }
  .rod-painel input[type=number] { width: 70px; padding: 6px; font: 600 14px 'Segoe UI', Arial, sans-serif; border: 1px solid var(--bt-borda);
                                   border-radius: 6px; background: var(--cartao); color: var(--texto); }
  .rod-painel .acoes { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  .rod-painel .msg { font-size: 13px; font-weight: 700; }
  /* Menu por assunto (estilo telao): faixa colorida a esquerda de cada bloco */
  .sec { margin-top: 12px; padding: 8px 10px 10px; border-left: 4px solid var(--tema-sec, #0f8f8f); background: var(--bt); border-radius: 0 6px 6px 0; }
  .sec > .grupo { margin: 0 0 6px; color: var(--tema-sec, #0f8f8f); font-size: 13px; }
  .sec.presidente { --tema-sec: #1f6fc0; } .sec.local { --tema-sec: #0f8f8f; } .sec.apuracao { --tema-sec: #128a12; }
  .sec.estados { --tema-sec: #8a5a12; } .sec.fav { --tema-sec: #b8860b; }
  .botoes.prontos button { font-weight: 700; }
  .botoes.prontos button.ativo, .botoes.prontos button.ativo:hover { background: var(--verde); border-color: var(--verde-borda); color: #fff; } .sec.camara { --tema-sec: #7a3fb0; } .sec.comparativos { --tema-sec: #c62828; } .sec.auto { --tema-sec: #5a6b80; }
  :root.escuro .sec { background: #172234; }
  .sec button { background: var(--cartao); }
  .sec button:hover { background: var(--bt-hover); }
  .sec button.ativo, .sec button.ativo:hover { background: var(--verm); border-color: var(--verm-borda); color: #fff; }
  .regs { display: grid; grid-template-columns: 150px 1fr; gap: 6px 8px; align-items: center; }
  .regs .reg { font-weight: 800; letter-spacing: 1px; text-align: left; white-space: nowrap; }
  .regs .ufs { display: flex; flex-wrap: wrap; gap: 4px; }
  .regs .ufs button { width: 46px; padding: 6px 0; }
  #ensaio { background: #c00000; color: #fff; font-weight: 800; letter-spacing: 1px; text-align: center; padding: 8px; position: sticky; top: 0; z-index: 9; }
  #ensaio[hidden] { display: none; }
  .ctldep .depregs { margin-top: 6px; }
  /* PREVIA (PVW) x NO AR (PGM): com a previa ligada, o clique so prepara a
     tela; ela vai ao ar no CORTAR. */
  .monitores { display: flex; gap: 10px; align-items: flex-start; }
  .monitores > div { flex: 1 1 0; min-width: 0; }
  .monitores.v.pvw-on > div { flex: 0 0 42%; }
  .monitores [hidden] { display: none !important; }
  .monitores .rot { font-size: 12px; font-weight: 800; letter-spacing: 1px; margin-bottom: 4px; color: var(--apagado); }
  .monitores .rot.pgm b { background: var(--verm); color: #fff; padding: 1px 7px; border-radius: 3px; }
  .monitores .rot.pvw b { background: var(--verde); color: #fff; padding: 1px 7px; border-radius: 3px; }
  .monitores .pvwbox { outline: 3px solid var(--verde); }
  .monitores .pvwvazio { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #8ea3bd; font-size: 13px; text-align: center; padding: 8px; }
  .pvwctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: -4px 0 10px; }
  .pvwctl .pvwnome { font-weight: 700; }
  button.cortar { background: var(--verm); border-color: var(--verm-borda); color: #fff; font-weight: 800; letter-spacing: .5px; }
  button.cortar:hover { background: var(--verm-borda); }
  button.cortar:disabled { opacity: .45; cursor: default; }
  button.pvwliga.ligado, button.pvwliga.ligado:hover { background: var(--verde); border-color: var(--verde-borda); color: #fff; }
  button.pvw-marcado { outline: 3px solid var(--verde); outline-offset: 1px; }
  .ctldep .depregs button.ativo { background: var(--azul); border-color: var(--azul-borda); color: #fff; }
</style>

<body>
<div id="ensaio" hidden>ENSAIO — DADOS FICTÍCIOS — ESTE GERENCIADOR NÃO VAI AO AR (o do ar é o da porta 8098)</div>
<header><h1>gctse — GERENCIADOR DAS SAÍDAS</h1>
  <a href="index.html" target="_blank">situação completa, avisos de virada e cores ↗</a>
  <a href="checklist.html" target="_blank">checklist do dia ↗</a>
  <span class="copia"><button id="copia" type="button" title="Guarda a pasta inteira (config, dados, evolução, logs) num .zip em copias-de-seguranca">💾 cópia de segurança</button> <span id="copiaMsg"></span></span>
  <button class="tema" id="tema" type="button">tema escuro</button></header>
<div id="status"><span class="st neutro" id="stP">Presidente: …</span><span class="st neutro" id="stE">Estados: …</span><span class="st neutro" id="stEv" hidden></span><span class="st neutro" id="stG">Gerenciador: …</span><span class="st neutro" id="stOh" hidden></span><span class="st neutro" id="stOv" hidden></span></div>

<script charset="utf-8" src="giro-config.js"></script>
<script charset="utf-8" src="apresentacao-config.js"></script>
<script charset="utf-8" src="deputados-config.js"></script>
<script charset="utf-8" src="graficos.js"></script>
<script charset="utf-8" src="dados.js"></script>
<script charset="utf-8" src="estados.js"></script>
<script>
(function () {
  "use strict";
  var cfg = window.GCTSE_GIRO || {};
  var NOMES_UF = ["ac","al","ap","am","ba","ce","df","es","go","ma","mt","ms","mg","pa","pb","pr","pe","pi","rj","rn","rs","ro","rr","sc","sp","se","to"];
  var ordem = (cfg.ordem || NOMES_UF).map(function (u) { return String(u).toLowerCase(); }).filter(function (u) { return NOMES_UF.indexOf(u) >= 0; });
  var RESUMO = ["Mapa dos governadores", "Governadores por partido", "Senado por partido", "Presidente por região",
                "Comparecimento", "Estado em destaque", "2026 × 2022"];
  var RESUMO_IDS = ["mapa-governadores", "governadores-partido", "senado-partido", "presidente-regiao",
                    "comparecimento", "estado", "comparativo-2022"];
  var cfgA = window.GCTSE_APRESENTACAO || {};
  var SAIDAS = [
    { id: "h", nome: "SAÍDA HORIZONTAL", sub: "OBS SAIDA-HORIZONTAL → canal da DeckLink escolhido nele · 1920×1080", W: 1920, H: 1080, f: "h" },
    { id: "v", nome: "SAÍDA VERTICAL", sub: "OBS SAIDA-VERTICAL → canal da DeckLink escolhido nele · tela 1080×1920 girada no quadro 1920×1080", W: 1080, H: 1920, f: "v" }
  ];
  var estado = null, autoTimer = { h: null, v: null };
  var REGIOES_MENU = [["NORTE", "norte", ["ac", "am", "ap", "pa", "ro", "rr", "to"]], ["NORDESTE", "nordeste", ["al", "ba", "ce", "ma", "pb", "pe", "pi", "rn", "se"]],
    ["CENTRO-OESTE", "centro-oeste", ["df", "go", "ms", "mt"]], ["SUDESTE", "sudeste", ["es", "mg", "rj", "sp"]], ["SUL", "sul", ["pr", "rs", "sc"]]];

  // ------------------------------------------------ rodizio da apresentacao
  // Vazio no gerenciador = as telas do apresentacao-config.js.
  function graficosDe(S) { return window.GCTSE_GRAFICOS.lista.filter(function (g) { return g.f === S.f; }); }
  function padraoRodizio(S) {
    var ok = graficosDe(S).map(function (g) { return g.id; });
    var l = ((S.f === "v" ? cfgA.vertical : cfgA.horizontal) || []).filter(function (id) { return ok.indexOf(id) >= 0; });
    return l.length ? l : ok;
  }
  function rodizioAtual(S) {
    var r = estado && estado[S.id] ? estado[S.id].rodizio : "";
    return r ? String(r).split(",") : padraoRodizio(S);
  }
  function tempoAtual(S) {
    var t = estado && estado[S.id] ? estado[S.id].tempo : 0;
    if (t >= 3) return t;
    t = parseFloat(cfgA.tempo_segundos);
    return t >= 3 ? t : 15;
  }
  function nomeTela(id, S) {
    if (id === "apresentacao") return "Apresentação automática (" + rodizioAtual(S).length + " telas, " + tempoAtual(S) + " s cada)";
    if (id === "giro") return "Giro dos estados";
    if (id === "resumo") return "Resumo (7 telas)";
    if (/^deputados-/.test(id)) { var pdn = posDep(S.id); return "Deputados federais — " + (!pdn ? "troca automática" : pdn.regiao ? "região " + pdn.nome : pdn.uf.toUpperCase() + " (5 mais votados)"); }
    if (/^presloc-/.test(id)) { var a = estado && estado[S.id] ? String(estado[S.id].acao || "") : ""; return "Presidente | " + (a.indexOf("alvo:") === 0 ? a.slice(5).toUpperCase() : "estado ou região"); }
    var g = window.GCTSE_GRAFICOS.lista.filter(function (x) { return x.id === id; })[0];
    return g ? g.nome : id;
  }
  function botao(txt, fn, extra) { var b = document.createElement("button"); b.textContent = txt; b.onclick = fn; if (extra) b.dataset.k = extra; return b; }
  function pedir(url) { return fetch(url + (url.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (e) { estado = e; pintar(); }); }
  function definirJa(s, tela, acao) { pararAuto(s); return pedir("/definir?saida=" + s + "&tela=" + encodeURIComponent(tela) + (acao ? "&acao=" + encodeURIComponent(acao) : "")); }
  function irAoAr(s, p) {
    if (p.rod) return pedir("/rodizio?saida=" + s + "&telas=" + encodeURIComponent(p.rod.telas) + "&tempo=" + p.rod.tempo).then(function () { return definirJa(s, p.tela, p.acao); });
    return definirJa(s, p.tela, p.acao);
  }
  // PREVIA (PVW): ligada, o clique so prepara (mostra ao lado do NO AR); o
  // CORTAR manda ao ar. Desligada: vai direto, como sempre. Lembrada por saida.
  var previa = { h: false, v: false }, pendente = { h: null, v: null };
  try { previa.h = localStorage.getItem("gctse-previa-h") === "1"; previa.v = localStorage.getItem("gctse-previa-v") === "1"; } catch (e) { }
  function definir(s, tela, acao, rod) {
    var p = { tela: tela, acao: acao || "", rod: rod || null };
    if (!previa[s]) return irAoAr(s, p);
    pendente[s] = p; mostrarPrevia(s); return Promise.resolve();
  }
  function nomePendente(s, p) {
    var S = SAIDAS.filter(function (x) { return x.id === s; })[0];
    if (p.rod) { var b = document.querySelector('#col-' + s + ' [data-pronto="' + p.rod.telas + '"]'); return (b ? b.textContent.replace(/^▶ /, "") : "rodízio") + " · " + p.rod.tempo + " s cada"; }
    var n = /^deputados-/.test(p.tela) ? "Deputados federais — " + (!p.acao ? "troca automática" : p.acao.indexOf("dep:r-") === 0 ? "região " + p.acao.slice(6).toUpperCase() : p.acao.slice(4, 6).toUpperCase())
      : /^presloc-/.test(p.tela) ? "Presidente | " + (p.acao.slice(5).toUpperCase() || "estado ou região")
      : p.tela === "giro" ? "Giro dos estados — " + p.acao.slice(3).toUpperCase()
      : p.tela === "resumo" ? "Resumo (7 telas)" : p.tela === "apresentacao" ? "Apresentação automática" : nomeTela(p.tela, S);
    return n;
  }
  function mostrarPrevia(s) {
    var col = document.getElementById("col-" + s), p = pendente[s], f = col.querySelector(".pvwbox iframe");
    col.querySelector(".pvwnome").textContent = p ? nomePendente(s, p) : "";
    col.querySelector(".pvwvazio").hidden = !!p;
    col.querySelector(".cortar").disabled = !p; col.querySelector(".descartar").disabled = !p;
    var url = p ? "saida.html?saida=" + s + "&previa=1&tela=" + encodeURIComponent(p.tela) + "&acao=" + encodeURIComponent(p.acao) +
      (p.rod ? "&rodizio=" + encodeURIComponent(p.rod.telas) + "&tempo=" + p.rod.tempo : "") : "about:blank";
    if (f.getAttribute("src") !== url) f.setAttribute("src", url);
    col.querySelectorAll(".pvw-marcado").forEach(function (b) { b.classList.remove("pvw-marcado"); });
    if (p) col.querySelectorAll(".botoes button[data-k], .regs button[data-k], [data-pronto]").forEach(function (b) {
      if (p.rod ? b.dataset.pronto === p.rod.telas : (b.dataset.k === p.tela + "|" + p.acao || (!p.acao && b.dataset.k === p.tela))) b.classList.add("pvw-marcado");
    });
  }
  function ligarPrevia(s, on) {
    previa[s] = on; if (!on) pendente[s] = null;
    try { localStorage.setItem("gctse-previa-" + s, on ? "1" : "0"); } catch (e) { }
    var col = document.getElementById("col-" + s);
    col.querySelector(".mon-pvw").hidden = !on; col.querySelector(".rot.pgm").hidden = !on;
    col.querySelector(".cortar").hidden = !on; col.querySelector(".descartar").hidden = !on;
    var bl = col.querySelector(".pvwliga"); bl.classList.toggle("ligado", on); bl.textContent = "prévia antes do ar: " + (on ? "LIGADA" : "DESLIGADA");
    col.querySelector(".mon-pgm .previa").style.maxWidth = on ? "none" : (s === "v" ? "42%" : "");
    col.querySelector(".monitores").classList.toggle("pvw-on", on);
    mostrarPrevia(s);
  }
  function comandar(s, acao) { return pedir("/comando?saida=" + s + "&acao=" + encodeURIComponent(acao)); }

  // Posicao atual do giro / resumo (o gerenciador manda sempre a posicao exata).
  function posicao(s) {
    var a = estado && estado[s] ? estado[s].acao || "" : "";
    if (a.indexOf("uf:") === 0) return { uf: a.slice(3) };
    if (a.indexOf("tela:") === 0) return { tela: parseInt(a.slice(5), 10) };
    if (a.indexOf("estado:") === 0) return { tela: TELA_ESTADO, ufr: a.slice(7) };
    return {};
  }
  // Resumo, tela 6 (Estado em destaque): o estado escolhido aqui (lembrado
  // por saida); comeca no estado_destaque do giro-config.js.
  var TELA_ESTADO = RESUMO_IDS.indexOf("estado") + 1;
  var ufInicial = String(cfg.estado_destaque || "pr").toLowerCase();
  if (ordem.indexOf(ufInicial) < 0) ufInicial = ordem[0];
  var ufResumo = { h: ufInicial, v: ufInicial };
  function acaoResumo(s, n) { return n === TELA_ESTADO ? "estado:" + ufResumo[s] : "tela:" + n; }
  function passo(s, d) {
    var e = estado[s];
    if (e.tela === "giro") {
      var i = ordem.indexOf(posicao(s).uf); if (i < 0) i = 0; else i = (i + d + ordem.length) % ordem.length;
      return comandar(s, "uf:" + ordem[i]);
    }
    if (e.tela === "resumo") {
      var n = posicao(s).tela || 1; n = ((n - 1 + d + RESUMO.length) % RESUMO.length) + 1;
      return comandar(s, acaoResumo(s, n));
    }
  }
  // Deputados: lista de telas (estado, n-esima tela do estado) na ordem regiao > estado.
  function depPags() { try { return window.GCTSE_GRAFICOS.depPaginas(); } catch (e) { return []; } }

      for (var r0 = 0; r0 < ps.length; r0++) if (p.ufs.indexOf(ps[r0].uf) >= 0) { i = r0; break; }
    } else if (p) { for (var j = 0; j < ps.length; j++) if (ps[j].uf === p.uf && ps[j].k === p.k) { i = j; break; } i = (i + d + ps.length) % ps.length; }
    comandar(S.id, "dep:" + ps[i].uf + ":" + ps[i].k);

  // Painel "escolher as telas do rodizio": graficos do Presidente, telas do
  // Resumo e Governador + Senador de cada estado (tela do giro).
  function painelRodizio(S) {
    var box = document.createElement("div"); box.className = "rodizio";
    box.innerHTML = '<div class="rod-linha"><button type="button" class="abrir">⚙ escolher as telas do rodízio</button>' +
      '<span class="rod-resumo"></span></div><div class="rod-painel" hidden></div>';
    var painel = box.querySelector(".rod-painel"), abrir = box.querySelector(".abrir");
    var itens = [];
    function secao(titulo, lista, classe) {
      var g = document.createElement("div"); g.innerHTML = '<div class="grupo">' + titulo + '</div>';
      var ops = document.createElement("div"); ops.className = "opcoes " + (classe || "");
      lista.forEach(function (it) {
        var lb = document.createElement("label"), cb = document.createElement("input");
        cb.type = "checkbox"; cb.value = it[0];
        cb.onchange = function () { lb.classList.toggle("marcado", cb.checked); msg(""); };
        lb.appendChild(cb); lb.appendChild(document.createTextNode(it[1]));
        if (/^estado:/.test(it[0])) lb.dataset.gov = it[0].slice(7);
        ops.appendChild(lb); itens.push(cb);
      });
      g.appendChild(ops); painel.appendChild(g);
    }
    // graficos: na ordem do apresentacao-config.js, depois os outros
    var gs = graficosDe(S), pad = padraoRodizio(S);
    gs.sort(function (a, b) {
      var ia = pad.indexOf(a.id), ib = pad.indexOf(b.id);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
    secao("GRÁFICOS", gs.map(function (g) { return [g.id, g.nome]; }));
    secao("PRESIDENTE | REGIÃO", REGIOES_MENU.map(function (rg) { return ["presloc:" + rg[1], rg[0]]; }));
    secao("PRESIDENTE | ESTADO", ordem.map(function (u) { return ["presloc:" + u, u.toUpperCase()]; }), "uf");
    secao("RESUMO", RESUMO_IDS.map(function (id, i) { return ["resumo:" + id, RESUMO[i]]; }));
    secao("GOVERNADOR E SENADOR — tela do estado", ordem.map(function (u) { return ["estado:" + u, u.toUpperCase()]; }), "uf");
    painel.lastChild.insertBefore(legendaGov(), painel.lastChild.children[1]);
    var ac = document.createElement("div"); ac.className = "acoes";
    ac.innerHTML = '<span>segundos por tela</span><input type="number" min="3" max="300" step="1" class="tempo">' +
      '<button type="button" class="aplicar">✔ aplicar no rodízio</button><button type="button" class="padrao">voltar ao padrão</button>' +
      '<button type="button" class="nenhuma">desmarcar todas</button><span class="msg"></span>';
    painel.appendChild(ac);
    var tempo = ac.querySelector(".tempo"), m = ac.querySelector(".msg");
    function msg(txt, ruim) { m.textContent = txt; m.style.color = ruim ? "var(--verm)" : "var(--ok-t)"; }
    function carregar() {
      var sel = rodizioAtual(S);
      itens.forEach(function (cb) { cb.checked = sel.indexOf(cb.value) >= 0; cb.parentNode.classList.toggle("marcado", cb.checked); });
      tempo.value = tempoAtual(S); msg("");
    }
    abrir.onclick = function () {
      painel.hidden = !painel.hidden;
      abrir.textContent = painel.hidden ? "⚙ escolher as telas do rodízio" : "✕ fechar a escolha";
      if (!painel.hidden) carregar();

    ac.querySelector(".aplicar").onclick = function () {
      var sel = itens.filter(function (cb) { return cb.checked; }).map(function (cb) { return cb.value; });

      if (!sel.length) { msg("marque ao menos uma tela", true); return; }

  // ---------------------------------------------------------------- pintar
  // Situacao do Governador de cada estado (estados.js). No 2o turno o
  // coletor marca turno 2 nos estados com 2o turno: esses ficam cinza mesmo
  // depois de definidos, para nao confundir na hora de escolher.
  function govSit(u) {
    var x = ((window.GCTSE_ESTADOS || {}).ufs || {})[u], g = x && x.gov && x.gov.tem ? x.gov : null;
    if (!g) return { tipo: "?" };
    var cs = Array.isArray(g.candidatos) ? g.candidatos : ((g.candidatos || {}).value || []);
    var el = cs.filter(function (c) { return c.eleito; })[0], seg = cs.filter(function (c) { return c.segundo_turno; });
    var turno2 = +g.turno === 2 || seg.length > 0;
    if (el && !(+g.turno === 2)) return { tipo: "eleito1", c: el };
    if (turno2) return { tipo: "segundo", c: el, cs: (seg.length ? seg : cs).slice(0, 2) };
    return { tipo: "apurando" };
  }
  function legendaGov() {
    var d = document.createElement("div"); d.className = "leg-gov";
    d.innerHTML = '<span><i class="gov-eleito"></i>governador eleito no 1º turno</span><span><i style="background:var(--bt);border-color:var(--bt-borda)"></i>2º turno (ou ainda apurando)</span>';
    return d;
  }
  function marcarGov() {
    document.querySelectorAll("[data-gov]").forEach(function (el) {
      var u = el.dataset.gov, st = govSit(u);
      el.classList.toggle("gov-eleito", st.tipo === "eleito1");
      el.title = u.toUpperCase() + " — " + (st.tipo === "eleito1" ? "governador ELEITO no 1º turno: " + st.c.nome + " (" + st.c.partido + ")" :
        st.tipo === "segundo" ? (st.c ? "2º turno — ELEITO: " + st.c.nome + " (" + st.c.partido + ")" : "2º TURNO" + (st.cs.length ? ": " + st.cs.map(function (c) { return c.nome; }).join(" × ") : "")) :
        st.tipo === "apurando" ? "governador em apuração" : "sem boletim do ESTADOS.bat");
    });
  }
  function pintar() {
    if (!estado) return;
    marcarGov();
    SAIDAS.forEach(function (S) {
      var e = estado[S.id] || {};
      document.querySelectorAll("#col-" + S.id + " [data-pronto]").forEach(function (b) { b.classList.toggle("ativo", e.tela === "apresentacao" && e.rodizio === b.dataset.pronto); });
    });
    SAIDAS.forEach(function (S) {
      var e = estado[S.id], col = document.getElementById("col-" + S.id), pos = posicao(S.id);
      var txt = nomeTela(e.tela, S);
      col.querySelector(".rod-resumo").textContent = "No rodízio: " + rodizioAtual(S).length + " telas · " + tempoAtual(S) + " s cada" +
        (e.rodizio ? "" : " (padrão)");
      if (e.tela === "giro" && pos.uf) txt += " — " + pos.uf.toUpperCase();
      if (e.tela === "resumo" && pos.tela) txt += " — " + pos.tela + ". " + RESUMO[pos.tela - 1] + (pos.ufr ? " — " + pos.ufr.toUpperCase() : "");
      if (pos.ufr) ufResumo[S.id] = pos.ufr;
      col.querySelector(".noar .tela").textContent = txt + (e.quando ? "  (desde " + e.quando + ")" : "");
      col.querySelectorAll(".botoes button[data-k], .regs button[data-k]").forEach(function (b) { b.classList.toggle("ativo", b.dataset.k === e.tela || b.dataset.k === e.tela + "|" + e.acao); });
      col.querySelectorAll(".girar button").forEach(function (b) { b.classList.toggle("ativo", String(estado.girar_v) === b.dataset.g); });
      var ctl = col.querySelector(".controle");
      ctl.classList.toggle("on", e.tela === "giro" || e.tela === "resumo");
      ctl.querySelector(".uf:not(.ufr)").style.display = e.tela === "giro" ? "flex" : "none";
      ctl.querySelector(".tl").style.display = e.tela === "resumo" ? "flex" : "none";
      ctl.querySelector(".ufr").style.display = e.tela === "resumo" ? "flex" : "none";
      var chaveTl = pos.ufr ? "tela:" + TELA_ESTADO : e.acao;
      ctl.querySelectorAll(".uf button, .tl button").forEach(function (b) { b.classList.toggle("ativo", b.dataset.k === e.acao || b.dataset.k === chaveTl); });
      ctl.querySelector(".auto").classList.toggle("ligado", !!autoTimer[S.id]);
      var cd = col.querySelector(".ctldep"), emDep = /^deputados-/.test(e.tela), pd = posDep(S.id);
      if (!emDep) marcarFaltaDep(col, depPags());
      cd.classList.toggle("on", emDep);
      if (emDep) {
        var ps = depPags();
        cd.querySelector(".deppos").textContent = !pd ? "troca automática (estados do deputados-config.js)" :
          (pd.regiao ? "região " + pd.nome + " (trocando entre os estados)" : pd.uf.toUpperCase() + " — os 5 mais votados");
        marcarFaltaDep(col, ps);
        cd.querySelector(".depauto").classList.toggle("ligado", !pd);
      }
      ctl.querySelector(".auto").textContent = autoTimer[S.id] ? "giro automático: LIGADO" : "giro automático";
    });
  }

  // --------------------------------------------------------- situacao
  function idade(g) { return g ? Math.round((Date.now() - new Date(g).getTime()) / 1000) : null; }
  function situacao() {
    marcarGov();
    var d = window.GCTSE_DADOS || {}, e = window.GCTSE_ESTADOS || {};
    var p = document.getElementById("stP"), s = document.getElementById("stE"), ip = idade(d.gravado_em), ie = idade(e.gravado_em);
    if (ip == null) { p.className = "st ruim"; p.textContent = "Presidente: coleta não rodou (abra o GRAFICOS.bat)"; }
    else if (ip > 90) { p.className = "st ruim"; p.textContent = "Presidente: COLETA PAROU há " + ip + " s"; }
    else if (d.recebendo_tse === false) { p.className = "st ruim"; p.textContent = d.tse_nao_publicou ? "Presidente: TSE ainda não publicou" : "Presidente: SEM RESPOSTA DO TSE"; }
    else { p.className = "st ok"; p.textContent = "Presidente: OK" + (d.br && d.br.tem && d.br.secoes ? " · " + String(d.br.secoes.pct).replace(".", ",") + "% das urnas" : ""); }
    if (ie == null) { s.className = "st neutro"; s.textContent = "Estados: coleta não aberta (só para giro/resumo)"; }
    else if (ie > 120) { s.className = "st ruim"; s.textContent = "Estados: COLETA PAROU há " + ie + " s"; }
    else if (e.recebendo_tse === false) { s.className = "st ruim"; s.textContent = "Estados: SEM RESPOSTA DO TSE"; }
    else { s.className = "st ok"; s.textContent = "Estados: OK"; }
    // Grafico minuto a minuto (evolucao): o GRAFICOS.bat grava um ponto a
    // cada boletim novo do TSE. Vermelho = apuracao andando e nada gravado
    // ha 5 min.
    var ev = document.getElementById("stEv"), pts = d.evolucao && d.evolucao.pontos ? (Array.isArray(d.evolucao.pontos) ? d.evolucao.pontos : d.evolucao.pontos.value || []) : [];
    var pctBr = d.br && d.br.tem && d.br.secoes ? d.br.secoes.pct : 0, iev = idade(d.evolucao_novo_em);
    ev.hidden = ip == null || !(pctBr > 0) && !pts.length;
    if (!ev.hidden) {
      var ult = pts.length ? String(pts[pts.length - 1].t || "").substr(11, 5) : "—";
      if (pctBr > 0 && pctBr < 100 && (iev == null || iev > 300)) { ev.className = "st ruim"; ev.textContent = "EVOLUÇÃO PAROU: " + pts.length + " pontos · nada novo há " + (iev == null ? "—" : Math.round(iev / 60) + " min"); }
      else { ev.className = "st ok"; ev.textContent = (pctBr >= 100 ? "EVOLUÇÃO GRAVADA: " : "GRAVANDO EVOLUÇÃO: ") + pts.length + " pontos · último " + ult; }
    }
    var ens = document.getElementById("ensaio"); if (ens) ens.hidden = !(d.ensaio || e.ensaio);
  }
  function recarregar(arq) {
    var sc = document.createElement("script"); sc.charset = "utf-8"; sc.src = arq + "?t=" + Date.now();
    sc.onload = function () { sc.remove(); situacao(); }; sc.onerror = function () { sc.remove(); };
    document.head.appendChild(sc);
  }
  // Situacao dos dois OBS automaticos (obs-saidas.ps1).
  function situacaoObs() {
    var o = (estado && estado.obs) || {};
    [["h", "stOh", "OBS HORIZONTAL"], ["v", "stOv", "OBS VERTICAL"]].forEach(function (x) {
      var el = document.getElementById(x[1]), st = o[x[0]] || "";
      el.hidden = !st;
      if (st === "ok") { el.className = "st ok"; el.textContent = x[2] + ": no ar"; }
      else if (st === "sem-decklink") { el.className = "st ruim"; el.textContent = x[2] + ": escolher o canal (Ferramentas › Saída DeckLink)"; }
      else if (st === "fechado") { el.className = "st ruim"; el.textContent = x[2] + ": FECHADO — ABRIR-OBS.bat"; }
    });
  }
  function lerEstado() {
    var g = document.getElementById("stG");
    fetch("/estado?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); })
      .then(function (e) { estado = e; pintar(); g.className = "st ok"; g.textContent = "Gerenciador: no ar"; situacaoObs(); })
      .catch(function () { g.className = "st ruim"; g.textContent = "Gerenciador: SEM CONEXÃO — a janela do GERENCIADOR fechou?"; });
  }
  // Copia de seguranca num clique (gerenciador.ps1 -> copia-seguranca.ps1).
  var bCopia = document.getElementById("copia"), mCopia = document.getElementById("copiaMsg");
  function verCopia(tentativas) {
    fetch("/copia?ver=1&t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (c) {
      if (c.ok === null && tentativas > 0) { mCopia.className = ""; mCopia.textContent = "copiando…"; setTimeout(function () { verCopia(tentativas - 1); }, 2000); return; }
      bCopia.disabled = false;
      if (c.ok === true) { mCopia.className = "ok"; mCopia.textContent = "✔ " + c.arquivo + " (" + c.mensagem + ")"; }
      else if (c.ok === false) { mCopia.className = "ruim"; mCopia.textContent = "FALHOU: " + c.mensagem + " — use o COPIA-DE-SEGURANCA.bat"; }
      else { mCopia.className = "ruim"; mCopia.textContent = "sem resposta — use o COPIA-DE-SEGURANCA.bat"; }
    }).catch(function () { bCopia.disabled = false; mCopia.className = "ruim"; mCopia.textContent = "gerenciador sem conexão — use o COPIA-DE-SEGURANCA.bat"; });
  }
  bCopia.onclick = function () {
    bCopia.disabled = true; mCopia.className = ""; mCopia.textContent = "copiando…";
    fetch("/copia?t=" + Date.now(), { cache: "no-store" }).then(function () { setTimeout(function () { verCopia(90); }, 1500); })
      .catch(function () { bCopia.disabled = false; mCopia.className = "ruim"; mCopia.textContent = "gerenciador sem conexão — use o COPIA-DE-SEGURANCA.bat"; });
  };
  var bTema = document.getElementById("tema");
  function nomeTema() { bTema.textContent = document.documentElement.className === "escuro" ? "tema claro" : "tema escuro"; }
  bTema.onclick = function () {
    var esc = document.documentElement.className !== "escuro";
    document.documentElement.className = esc ? "escuro" : "";
    try { localStorage.setItem("gctse-tema", esc ? "escuro" : "claro"); } catch (e) { }
    nomeTema();
  };
  nomeTema();
  situacao(); lerEstado();
  setInterval(lerEstado, 1500);
  setInterval(function () { recarregar("dados.js"); recarregar("estados.js"); }, 3000);
})();
</script>
